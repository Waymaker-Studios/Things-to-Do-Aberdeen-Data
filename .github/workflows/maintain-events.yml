name: Maintain Events

on:
  # GitHub cron is UTC. The script itself always evaluates expiry in Europe/London.
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report changes without committing events.json"
        required: false
        default: true
        type: boolean
      allow_large_removal:
        description: "Allow removal of more than 25% of activities after manual review"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: maintain-events
  cancel-in-progress: false

jobs:
  maintain:
    name: Validate and maintain events
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run maintenance tests
        run: python -m unittest discover -s tests -v

      - name: Validate current feed
        run: python scripts/maintain_events.py --validate-only

      - name: Run maintenance
        env:
          MANUAL_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          MANUAL_ALLOW_LARGE_REMOVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_large_removal || false }}
        run: |
          MAINTENANCE_ARGS=""
          if [ "$MANUAL_ALLOW_LARGE_REMOVAL" = "true" ]; then
            MAINTENANCE_ARGS="--allow-large-removal"
          fi

          if [ "$MANUAL_DRY_RUN" = "true" ]; then
            python scripts/maintain_events.py --dry-run $MAINTENANCE_ARGS
          else
            python scripts/maintain_events.py --apply $MAINTENANCE_ARGS
          fi

      - name: Validate maintained feed
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: python scripts/maintain_events.py --validate-only

      - name: Commit and push changed feed
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          if git diff --quiet -- events.json; then
            echo "No event changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Automatically remove expired events"
          git push origin HEAD:"${GITHUB_REF_NAME}"
